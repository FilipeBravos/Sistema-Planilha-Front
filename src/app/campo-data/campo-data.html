<span class="campo">
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    maxlength="10"
    placeholder="dd/mm/aaaa"
    [attr.name]="nome() || null"
    [attr.aria-label]="rotulo()"
    [attr.aria-invalid]="invalida()"
    [class.invalida]="invalida()"
    [title]="invalida() ? 'Data inválida' : ''"
    [value]="texto()"
    (input)="digitou($event)"
    (blur)="tocou()"
  />
  <button type="button" class="calendario" tabindex="-1" aria-label="Abrir calendário" title="Abrir calendário" (click)="abrirCalendario()">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4" />
      <path d="M2 6.5h12M5 1.8v2.6M11 1.8v2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </svg>
  </button>
  <input #seletor class="seletor" type="date" tabindex="-1" aria-hidden="true" (change)="escolheuNoCalendario($event)" />
</span>
